<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sinh nhật Ba</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
<style>
/* Layout: one centred column. The cake is the hero; after the candles go out, fireworks run behind and the wish slides up under the cake. */
:root {
  --bg: #0a2328;
  --bg2: #12424a;
  --ink: #fbefd8;
  --muted: #9cc7c0;
  --gold: #ffc857;
  --berry: #ff6b81;
  --mint: #7fe0c8;
  --icing: #ffd9e0;
  --sponge: #6b3a2c;
  --sponge2: #86463a;
  --plate: #e9dcc3;
  --font-body: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-script: 'Dancing Script', 'Segoe Script', cursive;
  color-scheme: dark;
}
html { background: var(--bg); }
body {
  margin: 0;
  min-height: 100%;
  padding-block: 20px 36px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background-color: var(--bg);
  background-image: radial-gradient(120% 70% at 50% 100%, var(--bg2), transparent 70%);
  color: var(--ink);
  font: 400 16px/1.65 var(--font-body);
  overflow-x: hidden;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image:
    radial-gradient(1.5px 1.5px at 12% 18%, #fff, transparent),
    radial-gradient(1px 1px at 28% 8%, #fff, transparent),
    radial-gradient(1.5px 1.5px at 44% 24%, #fff, transparent),
    radial-gradient(1px 1px at 63% 12%, #fff, transparent),
    radial-gradient(1.5px 1.5px at 79% 28%, #fff, transparent),
    radial-gradient(1px 1px at 90% 10%, #fff, transparent),
    radial-gradient(1px 1px at 6% 46%, #fff, transparent),
    radial-gradient(1.5px 1.5px at 95% 52%, #fff, transparent);
  opacity: .7;
  animation: twinkle 4s ease-in-out infinite alternate;
}
@keyframes twinkle { from { opacity: .35; } to { opacity: .85; } }
#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }
.stage {
  position: relative;
  z-index: 1;
  max-width: 560px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  text-align: center;
}
.eyebrow {
  margin: 8px 0 0;
  font-size: .78rem;
  font-weight: 600;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--muted);
}
h1 {
  margin: 0;
  font-size: clamp(1.9rem, 8vw, 3rem);
  line-height: 1.12;
  font-weight: 800;
  text-wrap: balance;
}
h1 em { font-style: normal; color: var(--gold); }
.cakewrap {
  position: relative;
  width: min(88vw, 360px);
  margin-top: 6px;
  cursor: pointer;
  border-radius: 24px;
  -webkit-tap-highlight-color: transparent;
}
.cakewrap:focus-visible { outline: 3px solid var(--ink); outline-offset: 6px; }
.glow {
  position: absolute;
  left: 4%; right: 4%; top: -6%;
  height: 62%;
  background: radial-gradient(closest-side, rgba(255, 200, 87, .38), transparent);
  transition: opacity .7s;
  pointer-events: none;
}
.glow.off { opacity: 0; }
svg { display: block; width: 100%; height: auto; max-width: 100%; position: relative; }
.fl { transform-box: fill-box; transform-origin: 50% 100%; animation: flick 1.1s ease-in-out infinite alternate; transition: opacity .35s, transform .35s; }
@keyframes flick {
  0% { transform: scale(1, 1) rotate(-2deg); }
  50% { transform: scale(.94, 1.08) rotate(2deg); }
  100% { transform: scale(1.04, .96) rotate(-1deg); }
}
.halo { transition: opacity .4s; }
.flame.out .fl { animation: none; opacity: 0; transform: scale(.3, .1); }
.flame.out .halo { opacity: 0; }
.smoke { opacity: 0; stroke: #cfe3df; stroke-width: 2; fill: none; stroke-linecap: round; }
.flame.out .smoke { animation: smoke 1.6s ease-out .1s; }
@keyframes smoke {
  0% { opacity: 0; transform: translateY(0); }
  20% { opacity: .7; }
  100% { opacity: 0; transform: translateY(-26px); }
}
.cake.puff { animation: puff .5s ease; }
@keyframes puff {
  20% { transform: translateX(-4px) rotate(-1deg); }
  50% { transform: translateX(4px) rotate(1deg); }
  80% { transform: translateX(-2px); }
}
.btn {
  font: inherit;
  font-weight: 800;
  font-size: 1.05rem;
  background: var(--gold);
  color: #2b1a0c;
  border: 0;
  border-radius: 999px;
  padding: 14px 34px;
  cursor: pointer;
  box-shadow: 0 6px 0 #c58d1f;
  transition: transform .12s, box-shadow .12s;
}
.btn:active { transform: translateY(3px); box-shadow: 0 3px 0 #c58d1f; }
.btn:focus-visible, .ghost:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }
.hint { margin: -4px 0 0; font-size: .85rem; color: var(--muted); }
.wish {
  width: 100%;
  margin-top: 6px;
  padding: 22px 22px 18px;
  text-align: left;
  background: rgba(255, 255, 255, .07);
  border: 1px solid rgba(255, 255, 255, .14);
  border-radius: 18px;
  animation: rise .8s ease both;
}
@keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
.script { margin: 0 0 6px; font: 600 1.7rem/1.2 var(--font-script); color: var(--gold); }
.wish p.text { margin: 0; font-size: 1.02rem; }
#rest { visibility: hidden; }
.sign { margin: 14px 0 0; font: 600 1.5rem/1.2 var(--font-script); color: var(--mint); text-align: right; }
.ghost {
  margin-top: 10px;
  font: inherit;
  font-size: .9rem;
  color: var(--muted);
  background: none;
  border: 1px solid rgba(156, 199, 192, .45);
  border-radius: 999px;
  padding: 8px 18px;
  cursor: pointer;
}
@media (prefers-reduced-motion: reduce) {
  *, *::before { animation: none !important; transition: none !important; }
}
</style>

<main class="stage">
  <p class="eyebrow">Sinh nhật Ba · 20/10</p>
  <h1 id="title">Ba ơi,<br><em>thổi nến nào!</em></h1>

  <div class="cakewrap" id="cakewrap" role="button" tabindex="0" aria-label="Thổi nến trên bánh sinh nhật">
    <div class="glow" id="glow"></div>
    <svg class="cake" id="cake" viewBox="0 0 320 300" aria-hidden="true">
      <defs>
        <linearGradient id="ff" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" style="stop-color:#ff8a2b"/>
          <stop offset=".6" style="stop-color:#ffd34d"/>
          <stop offset="1" style="stop-color:#fff7d1"/>
        </linearGradient>
        <radialGradient id="fg">
          <stop offset="0" style="stop-color:#ffc857;stop-opacity:.55"/>
          <stop offset="1" style="stop-color:#ffc857;stop-opacity:0"/>
        </radialGradient>
      </defs>
      <ellipse cx="160" cy="278" rx="150" ry="14" fill="#06161a" opacity=".5"/>
      <ellipse cx="160" cy="272" rx="146" ry="14" fill="var(--plate)"/>
      <!-- bottom tier -->
      <rect x="36" y="168" width="248" height="100" rx="16" fill="var(--sponge)"/>
      <g fill="var(--icing)">
        <rect x="36" y="168" width="248" height="26" rx="13"/>
        <rect x="60" y="184" width="16" height="34" rx="8"/>
        <rect x="104" y="184" width="14" height="24" rx="7"/>
        <rect x="150" y="184" width="18" height="40" rx="9"/>
        <rect x="200" y="184" width="14" height="22" rx="7"/>
        <rect x="240" y="184" width="16" height="32" rx="8"/>
      </g>
      <g>
        <rect x="58" y="234" width="9" height="3" rx="1.5" fill="var(--gold)" transform="rotate(30 62 235)"/>
        <rect x="96" y="246" width="9" height="3" rx="1.5" fill="var(--mint)" transform="rotate(-40 100 247)"/>
        <rect x="128" y="232" width="9" height="3" rx="1.5" fill="var(--berry)" transform="rotate(60 132 233)"/>
        <rect x="176" y="244" width="9" height="3" rx="1.5" fill="var(--gold)" transform="rotate(-20 180 245)"/>
        <rect x="214" y="230" width="9" height="3" rx="1.5" fill="var(--mint)" transform="rotate(45 218 231)"/>
        <rect x="248" y="246" width="9" height="3" rx="1.5" fill="var(--berry)" transform="rotate(-55 252 247)"/>
      </g>
      <g fill="var(--berry)">
        <circle cx="52" cy="166" r="7"/><circle cx="66" cy="164" r="6"/>
        <circle cx="254" cy="164" r="6"/><circle cx="268" cy="166" r="7"/>
      </g>
      <!-- top tier -->
      <rect x="80" y="112" width="160" height="66" rx="14" fill="var(--sponge2)"/>
      <g fill="var(--icing)">
        <rect x="80" y="112" width="160" height="22" rx="11"/>
        <rect x="104" y="128" width="12" height="26" rx="6"/>
        <rect x="148" y="128" width="14" height="36" rx="7"/>
        <rect x="196" y="128" width="12" height="24" rx="6"/>
      </g>
      <g id="candles"></g>
    </svg>
  </div>

  <button class="btn" id="blow" type="button">Thổi nến</button>
  <p class="hint" id="hint">Chạm vào bánh cũng được</p>

  <section class="wish" id="wish" hidden>
    <p class="script">Gửi Ba kính yêu của con,</p>
    <p class="text"><span id="typed"></span><span id="rest"></span></p>
    <p class="sign" id="sign"></p>
    <button class="ghost" id="again" type="button">Thắp nến lại</button>
  </section>
</main>
<canvas id="fx"></canvas>

<script>
(function () {
  var WISH = "Hôm nay là ngày đặc biệt — ngày sinh nhật của Ba. Cảm ơn Ba vì suốt bao năm qua đã luôn là trụ cột vững chãi, âm thầm gánh vác biết bao nhọc nhằn, nắng mưa để lo cho gia đình mình có một cuộc sống đủ đầy và bình yên nhất. Ba ít khi nói lời hoa mỹ, nhưng con luôn cảm nhận được tình thương bao la và sự kỳ vọng mà Ba dành cho con qua từng hành động nhỏ mỗi ngày. Bước sang tuổi mới, con chúc Ba luôn thật nhiều sức khỏe, tâm trí thảnh thơi, bình an và mỗi ngày đều có thêm thật nhiều niềm vui bên Mẹ và gia đình mình. Con sẽ luôn nỗ lực học tập, rèn luyện và hoàn thiện bản thân thật tốt để Ba luôn yên tâm và tự hào về con. Con thương và kính trọng Ba nhiều lắm!";
  var SIGN = "Con trai của Ba — Quân";

  var $ = function (id) { return document.getElementById(id); };
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  // candles
  var xs = [108, 134, 160, 186, 212];
  var cols = ['var(--gold)', 'var(--mint)', 'var(--berry)', 'var(--mint)', 'var(--gold)'];
  var html = '';
  xs.forEach(function (x, i) {
    html += '<rect x="' + (x - 5) + '" y="80" width="10" height="34" rx="2" fill="' + cols[i] + '"/>' +
      '<rect x="' + (x - .75) + '" y="73" width="1.5" height="8" fill="#2b1a14"/>' +
      '<g class="flame" transform="translate(' + x + ' 66)">' +
      '<circle class="halo" r="20" fill="url(#fg)"/>' +
      '<g class="fl" style="animation-delay:-' + (i * .23) + 's">' +
      '<path d="M0 -15 C 5 -8 7 -2 0 6 C -7 -2 -5 -8 0 -15Z" fill="url(#ff)"/>' +
      '</g>' +
      '<path class="smoke" d="M0 -8 q-6 -9 0 -17 t0 -17"/>' +
      '</g>';
  });
  $('candles').innerHTML = html;
  var flames = Array.prototype.slice.call(document.querySelectorAll('.flame'));

  // fireworks + confetti
  var cv = $('fx'), ctx = cv.getContext('2d');
  var W = 0, H = 0, parts = [], raf = 0;
  var COLORS = ['#ffc857', '#ff6b81', '#7fe0c8', '#8fb8ff', '#ffffff', '#ff9f5a'];
  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);
  var pick = function () { return COLORS[Math.floor(Math.random() * COLORS.length)]; };
  function burst(x, y) {
    var c1 = pick(), c2 = pick(), n = 64;
    for (var i = 0; i < n; i++) {
      var a = Math.random() * 6.283, s = 1.5 + Math.random() * 4.2;
      parts.push({ t: 's', x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, d: .009 + Math.random() * .012, c: i % 3 ? c1 : c2, r: 1.2 + Math.random() * 1.6 });
    }
    kick();
  }
  function confetti(n) {
    for (var i = 0; i < n; i++) {
      parts.push({ t: 'c', x: Math.random() * W, y: -20 - Math.random() * H * .5, vx: (Math.random() - .5) * 1.6, vy: 1 + Math.random() * 2, ph: Math.random() * 6, rot: Math.random() * 6, vr: (Math.random() - .5) * .25, w: 6 + Math.random() * 6, h: 9 + Math.random() * 6, c: pick() });
    }
    kick();
  }
  function tick() {
    ctx.clearRect(0, 0, W, H);
    for (var i = parts.length - 1; i >= 0; i--) {
      var p = parts[i];
      if (p.t === 's') {
        p.vx *= .985; p.vy = p.vy * .985 + .045; p.x += p.vx; p.y += p.vy; p.life -= p.d;
        if (p.life <= 0) { parts.splice(i, 1); continue; }
        ctx.globalAlpha = p.life; ctx.fillStyle = p.c;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r * p.life + .4, 0, 6.283); ctx.fill();
      } else {
        p.vy = Math.min(p.vy + .03, 3.2); p.ph += .05; p.x += p.vx + Math.sin(p.ph) * .8; p.y += p.vy; p.rot += p.vr;
        if (p.y > H + 20) { parts.splice(i, 1); continue; }
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.globalAlpha = 1; ctx.fillStyle = p.c;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
      }
    }
    ctx.globalAlpha = 1;
    raf = parts.length ? requestAnimationFrame(tick) : 0;
    if (!raf) ctx.clearRect(0, 0, W, H);
  }
  function kick() { if (!raf) raf = requestAnimationFrame(tick); }

  // state
  var lit = true, timers = [], typer = 0;
  function later(fn, ms) { timers.push(setTimeout(fn, ms)); }

  function typeWish() {
    var typed = $('typed'), rest = $('rest');
    $('sign').textContent = '';
    if (reduce) { typed.textContent = WISH; rest.textContent = ''; $('sign').textContent = SIGN; return; }
    var i = 0;
    typed.textContent = ''; rest.textContent = WISH;
    typer = setInterval(function () {
      i += 1;
      typed.textContent = WISH.slice(0, i);
      rest.textContent = WISH.slice(i);
      if (i >= WISH.length) { clearInterval(typer); $('sign').textContent = SIGN; }
    }, 26);
  }

  function celebrate() {
    $('title').innerHTML = 'Chúc mừng<br><em>sinh nhật Ba!</em>';
    $('wish').hidden = false;
    $('blow').hidden = true;
    $('hint').textContent = 'Chạm vào màn hình để bắn thêm pháo hoa';
    typeWish();
    if (reduce) return;
    confetti(110);
    for (var i = 0; i < 9; i++) {
      (function (k) {
        later(function () { burst(W * (.12 + Math.random() * .76), H * (.08 + Math.random() * .38)); }, k * 420);
      })(i);
    }
  }

  function blow() {
    if (!lit) return;
    lit = false;
    $('blow').disabled = true;
    $('hint').textContent = '';
    $('cake').classList.add('puff');
    $('glow').classList.add('off');
    flames.forEach(function (f, i) { later(function () { f.classList.add('out'); }, i * 140); });
    later(celebrate, reduce ? 0 : 1000);
  }

  function relight() {
    timers.forEach(clearTimeout); timers = [];
    clearInterval(typer);
    parts.length = 0;
    lit = true;
    flames.forEach(function (f) { f.classList.remove('out'); });
    $('cake').classList.remove('puff');
    $('glow').classList.remove('off');
    $('wish').hidden = true;
    $('title').innerHTML = 'Ba ơi,<br><em>thổi nến nào!</em>';
    $('blow').hidden = false; $('blow').disabled = false;
    $('hint').textContent = 'Chạm vào bánh cũng được';
    window.scrollTo(0, 0);
  }

  $('blow').addEventListener('click', blow);
  $('cakewrap').addEventListener('click', blow);
  $('cakewrap').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); blow(); }
  });
  $('again').addEventListener('click', relight);
  document.addEventListener('pointerdown', function (e) {
    if (lit || reduce || e.target.closest('button') || e.target.closest('.cakewrap')) return;
    burst(e.clientX, e.clientY);
  });
})();
</script>
